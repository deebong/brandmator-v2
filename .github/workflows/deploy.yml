name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "src/data/word-pools/dnjournal-live.ts"
      - "scripts/update-dnjournal-sales.mjs"
      - ".github/workflows/refresh-dnjournal.yml"
  workflow_run:
    workflows:
      - "Refresh DNJournal naming intelligence"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect Pages artifact
        run: |
          echo "=== dist ==="
          find dist -maxdepth 2 -type f -print
          echo "=== dist/index.html size ==="
          wc -c dist/index.html
          echo "=== dist/index.html head ==="
          head -c 1200 dist/index.html
          echo
          echo "=== script references ==="
          grep -o 'src="[^"]*"' dist/index.html || true
          echo "=== stylesheet references ==="
          grep -o 'href="[^"]*\.css[^"]*"' dist/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
